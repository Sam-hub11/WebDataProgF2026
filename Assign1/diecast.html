<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Drift - Add Diecast Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quantum Drift</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="register.html">Register</a> |
            <a href="login.html">Login</a> |
            <a href="diecast.html">Add Car</a>
        </nav>
    </header>

    <main>
        <h2>Add Item to Collection</h2>
        <form id="diecastForm">
            <div>
                <label for="modelName">Car Model Name:</label>
                <input type="text" id="modelName" placeholder="e.g. Nissan Skyline GT-R (R34)" required>
            </div>
            <div>
                <label for="brand">Brand:</label>
                <input type="text" id="brand" placeholder="e.g. Hot Wheels Premium" required>
            </div>
            <div>
                <label for="scale">Scale:</label>
                <input type="text" id="scale" value="1/64" required>
            </div>
            <div>
                <label for="purchasePrice">Purchase Price ($):</label>
                <input type="number" step="0.01" id="purchasePrice" placeholder="6.99">
            </div>
            <button type="submit">Save Car</button>
        </form>
    </main>

    <script src="diecast.js"></script>
</body>
</html>
